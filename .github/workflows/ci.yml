# 校验生成产物与契约一致，并逐模块编译。
#
# Go 模块无发布动作：打 tag 即发布，go get 直接从 git 读取。因此本流水线保证的是提交在仓库中的
# .gen.go 与契约一致——该文件即使用方获得的内容，构建期不存在补救环节，且 tag 不可变。
#
# 每个服务一个模块，仓库根不存在模块，`go build ./...` 在根目录不做任何事。逐模块编译由 find
# 展开，不写死服务名单：新增服务时若遗漏，表现为该模块从未被编译而流水线为绿。
name: ci

on:
  push:
    branches: [main]
    tags: ['*/v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - run: pip install pyyaml

      # 先 add -A 再比对暂存区：`git diff` 只看已跟踪的文件，而新增一个服务时它的
      # defaults.gen.go 属于未跟踪，遗漏提交同样为绿。
      - name: 生成产物与契约一致
        run: |
          python3 scripts/generate.py
          git add -A
          if ! git diff --cached --quiet; then
            echo "::error::契约已变更但生成产物未更新。执行 python3 scripts/generate.py 后提交。" >&2
            git --no-pager diff --cached --stat >&2
            exit 1
          fi

      - name: 产物已格式化
        run: |
          unformatted=$(gofmt -l . | grep -v '^leaflowapis/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未经 gofmt 格式化。" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: 逐模块编译
        run: |
          for mod in $(find . -name go.mod -not -path './leaflowapis/*' | xargs -n1 dirname | sort); do
            echo "── $mod"
            (cd "$mod" && go build ./... && go vet ./...)
          done
