name: ci

on:
  push:
    branches: [main]
    tags: ['**/v*']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
      - run: pip install pyyaml

      - name: Verify generated code matches the pinned contract
        run: |
          python3 scripts/generate.py
          git add -A
          if ! git diff --cached --quiet; then
            echo "::error::Contracts changed but generated code is out of date. Run python3 scripts/generate.py and commit the result." >&2
            git --no-pager diff --cached --stat >&2
            exit 1
          fi

      - name: Verify generated code is formatted
        run: |
          unformatted=$(gofmt -l . | grep -v '^leaflowapis/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not formatted with gofmt." >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Build each module
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            module="${GITHUB_REF_NAME%/v*}"
            [[ "$module" =~ ^[a-z][a-z0-9_-]*(/[a-z][a-z0-9_-]*)?$ ]] && test -f "$module/go.mod"
            modules=("$module")
          else
            modules=()
            for file in */go.mod */*/go.mod; do
              [[ -f "$file" ]] && modules+=("${file%/go.mod}")
            done
          fi
          for module in "${modules[@]}"; do
            echo "Building $module"
            (cd "$module" && go build ./... && go vet ./...)
          done
